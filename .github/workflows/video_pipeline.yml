name: Video Short Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: "Video URL to process"
        required: true
        type: string
      openrouter_model:
        description: "OpenRouter model ID (use none to disable)"
        required: false
        default: "none"
        type: string
      use_gemini:
        description: "Use Gemini for clip selection"
        required: false
        default: false
        type: boolean
      gemini_model:
        description: "Gemini model ID"
        required: false
        default: "gemini-2.5-flash"
        type: string

permissions:
  contents: read

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run processing pipeline
        env:
          SOURCE_VIDEO_URL: ${{ inputs.video_url }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ inputs.openrouter_model }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.gemini_model }}
          USE_GEMINI: ${{ inputs.use_gemini }}
        run: python pipeline.py --url "$SOURCE_VIDEO_URL"
      - name: Upload generated short
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: final-short-video
          path: final_short.mp4
          if-no-files-found: error
          retention-days: 7
