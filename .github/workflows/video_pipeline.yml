name: Video Short Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to process'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      openrouter_model:
        description: 'OpenRouter AI Model to use for humor/transcript analysis'
        required: false
        default: 'openai/gpt-4o-mini'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

    name: Video Short Pipeline

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to process'
        required: true
        default: 'https://www.youtube.com/watch?v=dQw4w9WgXcQ'
      openrouter_model:
        description: 'OpenRouter AI Model to use for humor/transcript analysis'
        required: false
        default: 'openai/gpt-4o-mini'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up FFmpeg
        uses: shivammathur/setup-ffmpeg@v2

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Processing Pipeline
        run: |
          python pipeline.py --url "${{ github.event.inputs.video_url }}"

      - name: Upload Generated Short
        uses: actions/upload-artifact@v4
        with:
          name: final-short-video
          path: final_short.mp4